{% extends 'app01/layout.html' %}

{% block content %}
<!--
    用户新建/编辑共用页：
    1. 用户名、邮箱、角色、启用状态由 ModelForm 渲染；
    2. 密码不在页面明文保存，新增时由后端 set_password 哈希；
    3. 仅超级管理员可进入该页面。
-->
<div class="panel panel-default">
    <div class="panel-heading">
        <span class="h4">
            {% if form.instance.pk %}编辑用户{% else %}新建用户{% endif %}
        </span>
    </div>
    <div class="panel-body">
        <form method="post" class="form-horizontal" style="max-width:600px;" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="col-sm-2 control-label">{{ field.label }}</label>
                <div class="col-sm-10">
                    {{ field }}
                    <span class="text-danger">{{ field.errors.0 }}</span>
                </div>
            </div>
            {% endfor %}
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-primary">提交</button>
                    <a href="/user_manage/list/" class="btn btn-default">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
