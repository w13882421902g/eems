{% extends 'app01/layout.html' %}

{% block content %}
<!--
    考勤新建/编辑共用页：
    1. 有主键时标题显示“编辑考勤”，否则显示“新增考勤”；
    2. 字段由 ModelForm 自动渲染，错误只取第一条，界面更简洁；
    3. 提交为 POST 且带 CSRF 令牌，后端保存后跳回考勤列表。
-->
<div class="panel panel-default">
    <div class="panel-heading">
        <span class="h4">
            {% if form.instance.pk %}编辑考勤{% else %}新增考勤{% endif %}
        </span>
    </div>
    <div class="panel-body">
        <form method="post" class="form-horizontal" style="max-width:600px;" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="col-sm-2 control-label">{{ field.label }}</label>
                <div class="col-sm-10">
                    {{ field }}
                    <span class="text-danger">{{ field.errors.0 }}</span>
                </div>
            </div>
            {% endfor %}
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-primary">提交</button>
                    <a href="/attendance/list/" class="btn btn-default">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
