{% extends 'app01/layout.html' %}

{% block content %}
<!--
    薪资新建/编辑共用页：
    1. 通过 form.instance.pk 判断编辑还是新建；
    2. 员工、月份等字段由 ModelForm 自动生成控件；
    3. 实发金额不需要在这里填，由模型根据基本工资、奖金、扣款计算。
-->
<div class="panel panel-default">
    <div class="panel-heading">
        <span class="h4">
            {% if form.instance.pk %}编辑薪资{% else %}新增薪资{% endif %}
        </span>
    </div>
    <div class="panel-body">
        <form method="post" class="form-horizontal" style="max-width:600px;" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="col-sm-2 control-label">{{ field.label }}</label>
                <div class="col-sm-10">
                    {{ field }}
                    <span class="text-danger">{{ field.errors.0 }}</span>
                </div>
            </div>
            {% endfor %}
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-primary">提交</button>
                    <a href="/salary/list/" class="btn btn-default">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
