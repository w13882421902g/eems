{% extends 'app01/layout.html' %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading">
        <span class="h4">部门列表</span>
        <a href="/depart/add/" class="btn btn-success pull-right">新建部门</a>
    </div>
    <div class="panel-body">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>负责人</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            {% for depart in depart_list %}
            <tr>
                <td>{{ depart.id }}</td>
                <td>{{ depart.title }}</td>
                <td>
                    {% if depart.leader %}
                        {{ depart.leader.username }}
                    {% else %}
                        -
                    {% endif %}
                </td>
                <td>
                    <a href="/depart/edit/{{ depart.id }}/"
                       class="btn btn-primary btn-sm btn-edit">编辑</a>
                    <a href="/depart/delete/{{ depart.id }}/"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('确定删除该部门吗？');">删除</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center text-muted">暂无数据</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
